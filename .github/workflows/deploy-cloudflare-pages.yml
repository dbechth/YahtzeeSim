name: Deploy Yahtzee Web to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - YahtzeeSim.Web/**
      - YahtzeeSim.Engine/**
      - YahtzeeSim.Engine.Tests/**
      - YahtzeeSim.Analysis/**
      - YahtzeeSim.Analysis.Tests/**
      - functions/**
      - functions-tests/**
      - migrations/**
      - wrangler.toml
      - package.json
      - package-lock.json
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  WEB_PROJECT: "YahtzeeSim.Web/YahtzeeSim.Web.csproj"
  TEST_PROJECT: "YahtzeeSim.Engine.Tests/YahtzeeSim.Engine.Tests.csproj"
  ANALYSIS_TEST_PROJECT: "YahtzeeSim.Analysis.Tests/YahtzeeSim.Analysis.Tests.csproj"
  PUBLISH_DIR: "YahtzeeSim.Web/bin/Release/net9.0/publish/wwwroot"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install API dependencies
        run: npm ci

      - name: Type-check and test API
        run: |
          npm run typecheck
          npm test
      - name: Run engine tests
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release

      - name: Run strategy analysis tests
        run: dotnet test ${{ env.ANALYSIS_TEST_PROJECT }} -c Release

      - name: Publish Blazor WebAssembly
        run: dotnet publish ${{ env.WEB_PROJECT }} -c Release

      - name: Validate Cloudflare project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail

          echo "Checking Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}' in account '${CLOUDFLARE_ACCOUNT_ID}'..."

          project_response=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT_NAME}")

          project_success=$(python -c "import json,sys; print(str(json.loads(sys.stdin.read()).get('success', False)).lower())" <<< "$project_response")

          if [ "$project_success" != "true" ]; then
            echo "Cloudflare project lookup failed."
            echo "This usually means the account id and project name do not belong together, or the project name secret is not exact."

            echo "Lookup API errors/messages:"
            python -c "import json,sys; d=json.loads(sys.stdin.read()); print('errors=', d.get('errors', [])); print('messages=', d.get('messages', []))" <<< "$project_response" || true

            echo "Available Pages projects in this account:"
            list_response=$(curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")

            list_success=$(python -c "import json,sys; print(str(json.loads(sys.stdin.read()).get('success', False)).lower())" <<< "$list_response")
            if [ "$list_success" != "true" ]; then
              echo "List API errors/messages:"
              python -c "import json,sys; d=json.loads(sys.stdin.read()); print('errors=', d.get('errors', [])); print('messages=', d.get('messages', []))" <<< "$list_response" || true
            fi

            project_count=$(python -c "import json,sys; data=json.loads(sys.stdin.read()); print(len(data.get('result', [])))" <<< "$list_response")
            python -c "import json,sys; data=json.loads(sys.stdin.read()); [print(p.get('name','')) for p in data.get('result',[]) if p.get('name')]" <<< "$list_response" || true

            if [ "$project_count" = "0" ]; then
              echo "No Pages projects were found in this account."
              echo "Create one in Cloudflare Dashboard: Workers & Pages -> Create -> Pages -> Connect to Git."
            fi

            echo "Set CLOUDFLARE_PAGES_PROJECT_NAME to one of the names above."
            exit 1
          fi

      - name: Apply D1 migrations
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "::warning::wrangler.toml still has the placeholder D1 database_id; skipping migrations. Accounts and the leaderboard will not work until it is set."
          else
            npx wrangler d1 migrations apply DB --remote
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.120.0"
          command: pages deploy ${{ env.PUBLISH_DIR }} --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --commit-dirty=true
