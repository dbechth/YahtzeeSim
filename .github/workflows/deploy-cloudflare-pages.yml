name: Deploy Yahtzee Web to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - YahtzeeSim.Web/**
      - .github/workflows/deploy-cloudflare-pages.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "9.0.x"
  WEB_PROJECT: "YahtzeeSim.Web/YahtzeeSim.Web.csproj"
  PUBLISH_DIR: "YahtzeeSim.Web/bin/Release/net9.0/publish/wwwroot"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT_NAME; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Blazor WebAssembly
        run: dotnet publish ${{ env.WEB_PROJECT }} -c Release

      - name: Validate Cloudflare project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          set -euo pipefail

          echo "Checking Pages project '${CLOUDFLARE_PAGES_PROJECT_NAME}' in account '${CLOUDFLARE_ACCOUNT_ID}'..."

          project_response=$(curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT_NAME}")

          project_success=$(python -c "import json,sys; print(str(json.loads(sys.stdin.read()).get('success', False)).lower())" <<< "$project_response")

          if [ "$project_success" != "true" ]; then
            echo "Cloudflare project lookup failed."
            echo "This usually means the account id and project name do not belong together, or the project name secret is not exact."

            echo "Available Pages projects in this account:"
            list_response=$(curl -sS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
            python -c "import json,sys; data=json.loads(sys.stdin.read()); [print(p.get('name','')) for p in data.get('result',[]) if p.get('name')]" <<< "$list_response" || true

            echo "Set CLOUDFLARE_PAGES_PROJECT_NAME to one of the names above."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.120.0"
          command: pages deploy ${{ env.PUBLISH_DIR }} --project-name ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch main --commit-dirty=true
