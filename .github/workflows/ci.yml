name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install API dependencies
        run: npm ci

      - name: Type-check and test API
        run: |
          npm run typecheck
          npm test

      - name: Run engine tests
        run: dotnet test YahtzeeSim.Engine.Tests/YahtzeeSim.Engine.Tests.csproj -c Release

      - name: Run strategy analysis tests
        run: dotnet test YahtzeeSim.Analysis.Tests/YahtzeeSim.Analysis.Tests.csproj -c Release

      - name: Build research desktop app (compile check only; it runs on Windows)
        run: dotnet build YahtzeeSim.Research/YahtzeeSim.Research.csproj -c Release -p:EnableWindowsTargeting=true

      - name: Build Web
        run: dotnet build YahtzeeSim.Web/YahtzeeSim.Web.csproj -c Release
