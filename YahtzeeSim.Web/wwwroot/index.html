<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f5f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="YahtzeeSim" />
    <title>YahtzeeSim</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="YahtzeeSim.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a href="." class="reload" onclick="return window.__yahtzeeSimResetApp && window.__yahtzeeSimResetApp();">Reset app data</a>
        <span class="dismiss">ðŸ—™</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.__yahtzeeSimResetApp = async function () {
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                    }
                }

                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }
            } finally {
                window.location.reload();
            }

            return false;
        };

        // Lets the app upload queued scores as soon as the device is back online.
        window.yahtzeeSimOnOnline = function (dotNetRef) {
            window.addEventListener('online', function () {
                dotNetRef.invokeMethodAsync('OnBackOnline');
            });
        };

        // Offline support: network-first service worker (see service-worker.published.js).
        // "Reset app data" above clears workers and caches if the app ever gets stuck.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).catch(() => {
                    // The app still works online without offline support.
                });
            });
        }    </script>
</body>

</html>
